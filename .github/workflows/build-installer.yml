name: Build Windows Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Obfuscate source with PyArmor
        shell: pwsh
        run: |
          pyarmor gen -O dist_obfuscated -r .
          Copy-Item -Recurse -Force assets dist_obfuscated/assets
          Copy-Item -Recurse -Force config dist_obfuscated/config
          # build.spec must live INSIDE dist_obfuscated, not be referenced
          # from outside it. PyInstaller resolves every relative path in a
          # .spec file (Analysis(['main.py'], ...)) against SPECPATH - the
          # spec file's OWN directory - not the shell's working directory.
          # Running `pyinstaller ../build.spec` from dist_obfuscated/ only
          # moves the CWD; the spec file itself still lives at the repo
          # root, so SPECPATH still points there and Analysis(['main.py'])
          # would silently resolve to the ORIGINAL, unobfuscated main.py
          # (and, following its imports, the rest of the unobfuscated
          # tree) - bundling straight past the entire PyArmor step.
          # Copying build.spec into dist_obfuscated puts SPECPATH exactly
          # where it needs to be.
          Copy-Item -Force build.spec dist_obfuscated/build.spec

      - name: Build executable with PyInstaller
        working-directory: dist_obfuscated
        # -OO strips docstrings and assert statements from compiled
        # bytecode before bundling - smaller PYZ archive, and the app's
        # own code has no assert-based logic to lose (verified: no real
        # `assert` usage outside test files).
        run: python -OO -m PyInstaller --distpath ../dist --workpath ../build build.spec

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ steps.version.outputs.version }} installer.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SDR_Controller_Setup
          path: dist_installer/SDR_Controller_Setup.exe

      - name: Attach installer to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || 'Latest build' }}
          prerelease: ${{ github.ref_type != 'tag' }}
          files: dist_installer/SDR_Controller_Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
